
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegan V3 - MMO</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script src="https://unpkg.com/colyseus.js@^0.15.0/dist/colyseus.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0a0a0f; overflow: hidden; }
        #game { width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 10px; left: 10px; color: #fff; font-family: Arial; z-index: 100; }
        #chat { position: absolute; bottom: 10px; left: 10px; width: 300px; z-index: 100; }
        #chatLog { background: rgba(0,0,0,0.7); height: 150px; overflow-y: auto; padding: 5px; color: #fff; font-size: 12px; }
        #chatInput { width: 100%; padding: 5px; }
        #login { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a2e; padding: 30px; border: 2px solid #00d9ff; color: #fff; text-align: center; }
       .classBtn { padding: 10px 20px; margin: 5px; background: #16213e; border: 1px solid #00d9ff; color: #fff; cursor: pointer; }
       .classBtn:hover { background: #00d9ff; color: #000; }
    </style>
</head>
<body>
    <div id="login">
        <h1>?? ELEGAN V3</h1>
        <p>Selecciona tu clase:</p>
        <button class="classBtn" onclick="startGame('guerrero_runico')">Guerrero Rúnico</button>
        <button class="classBtn" onclick="startGame('asesino_espectral')">Asesino Espectral</button>
        <button class="classBtn" onclick="startGame('mago_etereo')">Mago Etéreo</button>
        <button class="classBtn" onclick="startGame('tecnomante')">Tecnomante</button>
    </div>

    <div id="ui" style="display:none;">
        <div>LVL: <span id="level">1</span> | HP: <span id="hp">100</span> | MP: <span id="mp">100</span></div>
        <div>EXP: <span id="exp">0</span> | ORO: <span id="gold">0</span></div>
    </div>

    <div id="chat" style="display:none;">
        <div id="chatLog"></div>
        <input id="chatInput" type="text" placeholder="Presiona Enter para chatear..." />
    </div>

    <div id="game"></div>

    <script>
        let game, client, room, player, cursors, otherPlayers = {}, mobs = {};

        function startGame(selectedClass) {
            document.getElementById('login').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            document.getElementById('chat').style.display = 'block';
            initGame(selectedClass);
        }

        function initGame(playerClass) {
            const config = {
                type: Phaser.AUTO,
                width: window.innerWidth,
                height: window.innerHeight,
                parent: 'game',
                physics: { default: 'arcade' },
                scene: {
                    preload: preload,
                    create: create,
                    update: update
                }
            };
            game = new Phaser.Game(config);

            async function preload() {
                this.load.spritesheet('mago', 'assets/mago_etereo.png', { frameWidth: 32, frameHeight: 32 });
                this.load.image('slime', 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAA...');
            }

            async function create() {
                // Animaciones
                this.anims.create({ key: 'idle', frames: [{ key: 'mago', frame: 0 }] });
                this.anims.create({ key: 'walk', frames: this.anims.generateFrameNumbers('mago', { start: 1, end: 3 }), frameRate: 8, repeat: -1 });

                // Conectar a Colyseus
                client = new Colyseus.Client(window.location.protocol + '//' + window.location.host);
                room = await client.joinOrCreate('elegan', { class: playerClass });

                room.state.players.onAdd((p, sessionId) => {
                    if (sessionId === room.sessionId) {
                        player = this.physics.add.sprite(p.x, p.y, 'mago');
                        player.play('idle');
                        player.setCollideWorldBounds(true);
                    } else {
                        const other = this.physics.add.sprite(p.x, p.y, 'mago');
                        otherPlayers[sessionId] = other;
                    }
                });

                room.state.mobs.onAdd((mob, id) => {
                    const sprite = this.physics.add.sprite(mob.x, mob.y, 'slime');
                    sprite.setInteractive();
                    sprite.on('pointerdown', () => room.send('attack', id));
                    mobs[id] = sprite;
                });

                room.onMessage('chat', (data) => {
                    const log = document.getElementById('chatLog');
                    log.innerHTML += `<div>[${data.sender}]: ${data.message}</div>`;
                    log.scrollTop = log.scrollHeight;
                });

                cursors = this.input.keyboard.createCursorKeys();
                this.input.keyboard.on('keydown-SPACE', () => {
                    // Atacar mob más cercano
                    for (let id in mobs) {
                        if (Phaser.Math.Distance.Between(player.x, player.y, mobs[id].x, mobs[id].y) < 50) {
                            room.send('attack', id);
                            break;
                        }
                    }
                });
            }

            function update() {
                if (!player) return;
                
                let moved = false;
                if (cursors.left.isDown) { player.setVelocityX(-160); moved = true; }
                else if (cursors.right.isDown) { player.setVelocityX(160); moved = true; }
                else player.setVelocityX(0);

                if (cursors.up.isDown) { player.setVelocityY(-160); moved = true; }
                else if (cursors.down.isDown) { player.setVelocityY(160); moved = true; }
                else player.setVelocityY(0);

                if (moved) {
                    player.play('walk', true);
                    room.send('move', { x: player.x, y: player.y });
                } else {
                    player.play('idle', true);
                }

                // Update UI
                const myPlayer = room.state.players.get(room.sessionId);
                if (myPlayer) {
                    document.getElementById('level').textContent = myPlayer.level;
                    document.getElementById('hp').textContent = myPlayer.hp;
                    document.getElementById('mp').textContent = myPlayer.mp;
                    document.getElementById('exp').textContent = myPlayer.exp;
                    document.getElementById('gold').textContent = myPlayer.gold;
                }
            }

            // Chat
            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && e.target.value) {
                    room.send('chat', e.target.value);
                    e.target.value = '';
                }
            });
        }
    </script>
</body>
</html>
